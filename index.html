<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meus Resultados</title>
<style>
:root{--bg:#090b10;--card:#131720;--line:#252b37;--text:#f7f8fb;--muted:#9099aa;--green:#2ed573;--red:#ff4757}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#19202c 0,#090b10 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:24px 16px 40px}
h1{font-size:27px;margin:0}.sub{color:var(--muted);font-size:13px;margin:5px 0 18px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:11px}
.card{background:linear-gradient(#161b25,#11151c);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 12px 35px #0005}
.label{font-size:13px;color:var(--muted)}.big{font-size:31px;font-weight:900;margin-top:22px}
.form{margin-top:12px}.field{margin-top:12px}
.box{display:flex;align-items:center;gap:8px;background:#0c1016;border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin-top:6px}
.coin{font-weight:800;color:#c6ceda}
input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:25px;font-weight:850}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{border:0;border-radius:15px;padding:15px;color:white;font-weight:850;font-size:16px}
.lose{background:linear-gradient(#ff5967,#e43c4b)}.win{background:linear-gradient(#3cdd82,#20ba62)}
.note{font-size:12px;color:var(--muted);margin-top:11px}
.history{margin-top:12px}.head{display:flex;justify-content:space-between;align-items:center}.clear{background:transparent;color:var(--muted);padding:5px}
.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-of-type{margin-top:10px}.name{font-weight:800}.detail,.date{font-size:12px;color:var(--muted);margin-top:3px}
.result{font-size:17px;font-weight:900;white-space:nowrap}.pos{color:var(--green)}.neg{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:25px 0}
</style>
</head>
<body>
<div class="app">
<h1>Meus Resultados</h1>
<div class="sub">Controle de moeda do jogo</div>

<div class="grid">
 <div class="card"><div class="label">Lucro acumulado</div><div id="total" class="big">0,00</div></div>
 <div class="card"><div class="label">Registros</div><div id="count" class="big">0</div></div>
</div>

<div class="card form">
 <div class="field"><div class="label">Valor colocado</div><div class="box"><span class="coin">◉</span><input id="cost" inputmode="decimal" placeholder="3,50"></div></div>
 <div class="field"><div class="label">Total que volta ao ganhar</div><div class="box"><span class="coin">◉</span><input id="back" inputmode="decimal" placeholder="6,00"></div></div>
 <div class="buttons"><button class="lose" onclick="add(false)">Perdeu</button><button class="win" onclick="add(true)">Ganhou</button></div>
 <div class="note">Ex.: colocou 3,50 e voltou 6,00 → lucro +2,50.</div>
</div>

<div class="card history">
 <div class="head"><b>Histórico</b><button class="clear" onclick="clearAll()">Limpar</button></div>
 <div id="list"></div>
</div>
</div>

<script>
const KEY="game_results_profit_v4";
let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const fmt=n=>Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function num(v){v=v.trim().replace(/\./g,"").replace(",",".");return Number(v)}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function add(won){
 const cost=num(document.getElementById("cost").value);
 const back=num(document.getElementById("back").value);
 if(!Number.isFinite(cost)||cost<=0){alert("Digite o valor colocado.");return}
 if(won&&(!Number.isFinite(back)||back<0)){alert("Digite o total que volta.");return}
 const profit=won?back-cost:-cost;
 data.unshift({cost,back:won?back:0,profit,won,date:new Date().toISOString()});
 save();document.getElementById("cost").value="";document.getElementById("back").value="";render();
}
function del(i){if(confirm("Excluir este registro?")){data.splice(i,1);save();render()}}
function clearAll(){if(data.length&&confirm("Apagar todo o histórico?")){data=[];save();render()}}
function render(){
 const total=data.reduce((s,x)=>s+x.profit,0),t=document.getElementById("total");
 t.textContent=(total>0?"+":total<0?"−":"")+fmt(total);t.className="big "+(total>0?"pos":total<0?"neg":"");
 document.getElementById("count").textContent=data.length;
 const list=document.getElementById("list");
 if(!data.length){list.innerHTML='<div class="empty">Nenhum registro ainda.</div>';return}
 list.innerHTML=data.map((x,i)=>{
   const d=new Date(x.date).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
   return `<div class="item" onclick="del(${i})"><div><div class="name">${x.won?"Ganhou":"Perdeu"}</div><div class="detail">Colocou ${fmt(x.cost)} • voltou ${fmt(x.back)}</div><div class="date">${d} • toque para excluir</div></div><div class="result ${x.profit>=0?"pos":"neg"}">${x.profit>=0?"+":"−"}${fmt(x.profit)}</div></div>`
 }).join("");
}
render();
</script>
</body></html>
